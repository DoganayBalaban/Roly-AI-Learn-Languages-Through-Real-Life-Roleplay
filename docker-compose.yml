services:
  server:
    build: ./server
    container_name: express_server
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
    env_file:
      - ./server/.env

  landing:
    build: ./landing
    container_name: nextjs_landing
    ports:
      - "3000:3000"
    volumes:
      - ./landing:/app
      - /app/.next
      - /app/node_modules

  mobile:
    build: ./mobile
    container_name: expo_mobile
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - ./mobile:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    env_file:
      - ./mobile/.env

